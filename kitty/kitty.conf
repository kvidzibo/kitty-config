# Font (match Alacritty)
font_family      Hack Nerd Font Mono
font_size        11
# Tab status icons (git logo, check, working pie): the Mono font squeezes icons
# into one cell; this variant draws them larger, over the space that follows.
symbol_map U+F02A2,U+F0E1E,U+F0A9E-U+F0AA5 Hack Nerd Font

# Shift+Enter -> ESC+CR (newline, not submit, in agent CLIs)
map shift+enter send_text all \x1b\r

# Find the preview helpers by name (launch commands cannot expand ~)
exe_search_path +~/.config/kitty/scripts

# Image preview, keyboard: pick a path on screen, render inline in overlay
map alt+i kitten hints --type path --program "launch --type=overlay --color=background=#252035 --color=foreground=#e6e6e6 kitty-image-overlay.sh"

# Alt+click follows links (Claude Code emits OSC8 file:// links) -> see open-actions.conf
mouse_map alt+left release grabbed,ungrabbed mouse_handle_click link

# Ctrl-click opens links without switching to a newly opened tab
mouse_map ctrl+left release grabbed,ungrabbed kitten scripts/kitty-background-link.py
mouse_map ctrl+alt+left click grabbed,ungrabbed kitten scripts/kitty-background-link.py

# Shift-click image links in a reusable image-only OS window
mouse_map shift+left click grabbed,ungrabbed kitten scripts/kitty-image-window.py
mouse_map shift+alt+left click grabbed,ungrabbed kitten scripts/kitty-image-window.py

# Keep middle-click paste when an app captures the mouse (e.g. Pi fullscreen)
mouse_map middle press grabbed discard_event
mouse_map middle release grabbed paste_selection

# Ctrl+Shift-click opens links in the background
mouse_map ctrl+shift+left release grabbed,ungrabbed discard_event
mouse_map ctrl+shift+left click grabbed,ungrabbed kitten scripts/kitty-background-link.py

strip_trailing_spaces smart
scrollback_lines 10000000
enable_audio_bell no
confirm_os_window_close 1

# Splits + directional focus (hjkl)
enabled_layouts splits,stack
map alt+r launch --location=vsplit --cwd=oldest
map alt+d launch --location=hsplit --cwd=oldest
map alt+t kitten new_named_tab.py current
map ctrl+shift+t kitten new_named_tab.py
map alt+shift+r set_tab_title
map alt+h     kitten focus_or_tab.py left
map alt+j     kitten focus_or_tab.py bottom
map alt+k     kitten focus_or_tab.py top
map alt+l     kitten focus_or_tab.py right
map alt+left  kitten focus_or_tab.py left
map alt+down  kitten focus_or_tab.py bottom
map alt+up    kitten focus_or_tab.py top
map alt+right kitten focus_or_tab.py right

# Move panes
map ctrl+alt+left  kitten move_or_tab.py left
map ctrl+alt+down  kitten move_or_tab.py bottom
map ctrl+alt+up    kitten move_or_tab.py top
map ctrl+alt+right kitten move_or_tab.py right

# Extract focused pane to a new tab; suggest its current directory name
map ctrl+alt+t kitten detach_named_tab.py

# Move the entire tab, including splits, to a new OS window
map ctrl+alt+w detach_tab new

# Rename tab
map ctrl+alt+r set_tab_title

# zellij-like: gaps + framed active pane + tab bar
window_margin_width 4
window_padding_width 4
draw_minimal_borders yes
draw_window_borders_for_single_window yes
window_border_width 1pt
active_border_color   #00d787
inactive_border_color #444444
# Tab bar position: tabs-left.conf (sidebar) or tabs-top.conf (previous layout)
include tabs-left.conf
tab_bar_background #20242b
tab_bar_min_tabs 1
tab_title_template " {bell_symbol}{custom}{title} "
progress_bar hidden
bell_on_tab ""
active_tab_foreground   #e6e6e6
active_tab_background   #343b46
active_tab_font_style   bold
inactive_tab_foreground #9299a5
inactive_tab_background #20242b
inactive_tab_font_style normal

# Auto-persist: remote control + load saved layout on startup
allow_remote_control socket-only
listen_on unix:@mykitty
startup_session ~/.config/kitty/main.session
