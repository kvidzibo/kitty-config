# Tab bar as a left sidebar. Select with `include tabs-left.conf` in kitty.conf.
tab_bar_edge left
# Padding: margins painted in the panel colour (edge/content gap, above/below)
tab_bar_margin_height 10 10
tab_bar_margin_width 8
tab_bar_margin_color #20242b
tab_bar_style separator
# Also sets the sidebar width.
tab_title_max_length 24
# Long titles wrap onto a second line, then end with …
tab_title_wrap yes
tab_title_max_lines 2
