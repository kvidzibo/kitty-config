# Open formatted Markdown in its own temporary tab
protocol file
ext md
action launch --type=tab --tab-title=${FILE} --color=background=#252035 --color=foreground=#e6e6e6 kitty-text-preview.sh --markdown ${FILE_PATH}

# Open patches and colored Git diffs with a persistent full-path header
protocol file
ext diff,patch,ansi
action launch --type=tab --tab-title=${FILE} --color=background=#252035 --color=foreground=#e6e6e6 kitty-text-preview.sh ${FILE_PATH}

# Open extensionless admin-password files in temporary preview tabs
protocol file
file admin-password
action launch --type=tab --tab-title=${FILE} --color=background=#252035 --color=foreground=#e6e6e6 kitty-text-preview.sh ${FILE_PATH}

# Open local HTML previews in the default browser, not a text tab
protocol file
ext html,htm
action launch --type=background xdg-open ${URL}

# Open other plain-text files in temporary preview tabs
protocol file
mime text/*
action launch --type=tab --tab-title=${FILE} --color=background=#252035 --color=foreground=#e6e6e6 kitty-text-preview.sh ${FILE_PATH}

# Clicked image file links open via icat in their own temporary tab
protocol file
mime image/*
action launch --type=tab --tab-title=${FILE} --color=background=#252035 --color=foreground=#e6e6e6 kitty-image-overlay.sh ${FILE_PATH}
